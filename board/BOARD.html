<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio V3 — Team Scrum & DDD Board</title>
  <style id="board-ui-css">
/* AI Studio Board — design tokens + components.
 * Style: flat, dense dashboard (no gradients, borders over shadows). System fonts only (works offline / file://).
 * Theming: [data-theme="light|dark"] forces a mode; no attribute → follows prefers-color-scheme.
 */

/* ───────────── tokens ───────────── */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --hover: #eef2f7;
  --border: #dde3ec;
  --border-strong: #c4cdda;

  --text: #0f172a;
  --text-2: #475569;
  --text-3: #566377;

  --primary: #2563eb;
  --primary-btn: #2563eb;
  --primary-btn-hover: #1d4ed8;
  --primary-soft: #e0e9ff;
  --primary-text: #1d4ed8;
  --on-primary: #ffffff;

  --ok: #059669;
  --ok-soft: #d9f5e8;
  --ok-text: #047857;
  --warn: #d97706;
  --warn-soft: #fdf0d0;
  --warn-text: #b45309;
  --danger: #dc2626;
  --danger-soft: #fde4e4;
  --danger-text: #b91c1c;
  --info: #7c3aed;
  --info-soft: #ece6fd;
  --info-text: #6d28d9;
  --neutral: #64748b;
  --neutral-soft: #e8edf3;
  --neutral-text: #475569;

  --scrim: rgba(15, 23, 42, 0.45);
  --shadow-pop: 0 12px 32px rgba(15, 23, 42, 0.18);

  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --r-sm: 6px;
  --r: 10px;
  --icon: 16px;
  --control-h: 32px;
  --topbar-h: 52px;
  --col-w: 280px;
  --ease: 140ms ease-out;

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1020;
    --surface: #121a2b;
    --surface-2: #182236;
    --hover: #1f2b42;
    --border: #263349;
    --border-strong: #3a4a66;
    --text: #f1f5f9;
    --text-2: #a8b5c9;
    --text-3: #8c9bb2;
    --primary: #60a5fa;
    --primary-btn-hover: #1d4ed8;
    --primary-soft: rgba(96, 165, 250, 0.16);
    --primary-text: #93c5fd;
    --ok: #34d399;
    --ok-soft: rgba(52, 211, 153, 0.15);
    --ok-text: #34d399;
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.15);
    --warn-text: #fbbf24;
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, 0.16);
    --danger-text: #fca5a5;
    --info: #a78bfa;
    --info-soft: rgba(167, 139, 250, 0.16);
    --info-text: #c4b5fd;
    --neutral: #94a3b8;
    --neutral-soft: rgba(148, 163, 184, 0.16);
    --neutral-text: #b4c0d2;
    --scrim: rgba(2, 6, 16, 0.65);
    --shadow-pop: 0 12px 36px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0b1020;
  --surface: #121a2b;
  --surface-2: #182236;
  --hover: #1f2b42;
  --border: #263349;
  --border-strong: #3a4a66;
  --text: #f1f5f9;
  --text-2: #a8b5c9;
  --text-3: #8c9bb2;
  --primary: #60a5fa;
  --primary-btn-hover: #1d4ed8;
  --primary-soft: rgba(96, 165, 250, 0.16);
  --primary-text: #93c5fd;
  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, 0.15);
  --ok-text: #34d399;
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.15);
  --warn-text: #fbbf24;
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.16);
  --danger-text: #fca5a5;
  --info: #a78bfa;
  --info-soft: rgba(167, 139, 250, 0.16);
  --info-text: #c4b5fd;
  --neutral: #94a3b8;
  --neutral-soft: rgba(148, 163, 184, 0.16);
  --neutral-text: #b4c0d2;
  --scrim: rgba(2, 6, 16, 0.65);
  --shadow-pop: 0 12px 36px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ───────────── base ───────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h2 {
  font-size: 14px;
  font-weight: 650;
}

code,
pre,
kbd {
  font-family: var(--mono);
}

code {
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--neutral-soft);
  color: var(--text);
  font-size: 12px;
  overflow-wrap: anywhere;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

[inert] {
  pointer-events: none;
}

#board-app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

.ico {
  width: var(--icon);
  height: var(--icon);
  flex: none;
}

.spacer {
  flex: 1;
}

.muted {
  color: var(--text-3);
}

.small {
  font-size: 12px;
}

.nowrap {
  white-space: nowrap;
}

.row {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
}

.row--center {
  justify-content: center;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--s4);
}

/* ───────────── top bar ───────────── */
.topbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s2) var(--s5);
  min-height: var(--topbar-h);
  padding: 0 var(--s4);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--s2);
}

.brand__logo {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: var(--r-sm);
  background: var(--primary-btn);
  color: var(--on-primary);
}

.brand__name {
  font-size: 14px;
}

.tabs {
  display: flex;
  align-self: stretch;
  gap: var(--s1);
  overflow-x: auto;
}

.tab {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  padding: 0 var(--s3);
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--text-2);
  font-weight: 600;
  white-space: nowrap;
  transition: color var(--ease), border-color var(--ease);
}

.tab:hover {
  color: var(--text);
}

.tab[aria-current="page"] {
  color: var(--primary-text);
  border-bottom-color: var(--primary);
}

.tab__count {
  min-width: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--neutral-soft);
  color: var(--neutral-text);
  font-size: 12px;
  text-align: center;
}

.tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s3);
  margin-left: auto;
}

.inline-field {
  display: flex;
  align-items: center;
  gap: var(--s2);
  color: var(--text-2);
  font-weight: 600;
}

.conn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-3);
  font-size: 12px;
  white-space: nowrap;
}

.conn__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--neutral);
}

.conn--live .conn__dot {
  background: var(--ok);
}

.conn--offline .conn__dot {
  background: var(--danger);
}

.conn--connecting .conn__dot {
  background: var(--warn);
}

.banner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s3);
  padding: var(--s2) var(--s4);
  background: var(--warn-soft);
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

.banner .ico {
  color: var(--warn-text);
}

/* ───────────── controls ───────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--control-h);
  padding: 0 var(--s3);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
  transition: background var(--ease), border-color var(--ease), color var(--ease);
}

.btn:hover {
  background: var(--hover);
}

.btn--sm {
  min-height: 28px;
  padding: 0 var(--s2);
  font-size: 12px;
}

.btn--icon {
  width: var(--control-h);
  padding: 0;
}

.btn--icon.btn--sm {
  width: 28px;
}

.btn--primary {
  border-color: var(--primary-btn);
  background: var(--primary-btn);
  color: var(--on-primary);
}

.btn--primary:hover {
  border-color: var(--primary-btn-hover);
  background: var(--primary-btn-hover);
}

.btn--ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-2);
}

.btn--danger-outline {
  border-color: var(--danger);
  color: var(--danger-text);
}

.btn--danger-outline:hover {
  background: var(--danger-soft);
}

.btn--locked,
.btn[aria-disabled="true"] {
  border-style: dashed;
  background: transparent;
  color: var(--text-3);
}

.input,
.select {
  min-height: var(--control-h);
  max-width: 100%;
  padding: 0 var(--s2);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--ease);
}

.input:hover,
.select:hover {
  border-color: var(--text-3);
}

.input[aria-invalid="true"] {
  border-color: var(--danger);
}

.input--sm,
.select--sm {
  min-height: 28px;
  font-size: 12px;
}

.input--num {
  width: 72px;
}

.check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-2);
  font-weight: 600;
  cursor: pointer;
}

.check--block {
  display: flex;
  align-items: flex-start;
  padding: var(--s2) 0;
  font-weight: 400;
  color: var(--text);
}

.check input {
  width: 16px;
  height: 16px;
  margin: 1px 0 0;
  accent-color: var(--primary-btn);
}

.seg {
  display: inline-flex;
  padding: 2px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  background: var(--surface-2);
}

.seg__btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 26px;
  padding: 0 var(--s3);
  border: 0;
  border-radius: 4px;
  background: none;
  color: var(--text-2);
  font-weight: 600;
}

.seg__btn[aria-pressed="true"] {
  background: var(--primary-btn);
  color: var(--on-primary);
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--neutral-soft);
  color: var(--neutral-text);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.badge--primary {
  background: var(--primary-soft);
  color: var(--primary-text);
}

.badge--ok {
  background: var(--ok-soft);
  color: var(--ok-text);
}

.badge--warn {
  background: var(--warn-soft);
  color: var(--warn-text);
}

.badge--danger {
  background: var(--danger-soft);
  color: var(--danger-text);
}

.badge--info {
  background: var(--info-soft);
  color: var(--info-text);
}

.link,
.id-link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--primary-text);
  text-align: left;
}

.id-link {
  font: 650 12px var(--mono);
}

.link:hover,
.id-link:hover {
  text-decoration: underline;
}

.count {
  min-width: 22px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--neutral-soft);
  color: var(--neutral-text);
  font-size: 12px;
  font-weight: 600;
  text-align: center;
}

/* ───────────── layout ───────────── */
.main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  padding: var(--s4);
  overflow: auto;
}

.main--board {
  overflow: hidden;
}

.main--board.main--list {
  overflow: hidden;
}

.main--sprint,
.main--team,
.main--retro {
  align-items: stretch;
}

.k-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.mine {
  flex: none;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s2) var(--s4);
  padding: var(--s2) var(--s3);
  border: 1px solid var(--border);
  border-left: 3px solid var(--primary);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--text-2);
}

.mine__who {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
}

.mine strong {
  color: var(--text);
}

.mine__cmd {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}

.toolbar {
  flex: none;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s2) var(--s3);
}

.toolbar__count {
  margin-left: auto;
  color: var(--text-3);
}

.search {
  position: relative;
  display: flex;
  align-items: center;
}

.search .ico {
  position: absolute;
  left: var(--s2);
  color: var(--text-3);
  pointer-events: none;
}

.search .input {
  width: 260px;
  padding-left: 30px;
  padding-right: 28px;
}

.search kbd {
  position: absolute;
  right: var(--s2);
  padding: 0 5px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  color: var(--text-3);
  font-size: 11px;
  pointer-events: none;
}

/* ───────────── board ───────────── */
.kgrid {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: var(--s3);
  overflow-x: auto;
  padding-bottom: var(--s1);
}

.kcol {
  position: relative;
  flex: 0 0 var(--col-w);
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-top: 3px solid var(--col, var(--neutral));
  border-radius: var(--r);
  background: var(--surface-2);
}

.tone-neutral {
  --col: var(--neutral);
}

.tone-primary {
  --col: var(--primary);
}

.tone-warn {
  --col: var(--warn);
}

.tone-info {
  --col: var(--info);
}

.tone-danger {
  --col: var(--danger);
}

.tone-ok {
  --col: var(--ok);
}

.kcol--rail {
  flex-basis: 44px;
  align-items: center;
  gap: var(--s2);
  padding: var(--s3) 0;
  color: var(--text-2);
  font-weight: 600;
  background: var(--surface-2);
}

.kcol--rail:hover {
  background: var(--hover);
}

.kcol__rail-label {
  writing-mode: vertical-rl;
  white-space: nowrap;
}

.kcol__head {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
}

.kcol__head h2 {
  flex: 1;
  font-size: 13px;
}

.kcol__body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  padding: 0 var(--s2) var(--s2);
  overflow-y: auto;
}

.kcol__empty {
  padding: var(--s5) var(--s2);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-sm);
  color: var(--text-3);
  text-align: center;
}

.kcol.is-drop-ok {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
  background: var(--primary-soft);
}

.kcol.is-drop-blocked {
  outline: 2px dashed var(--danger);
  outline-offset: -2px;
}

.kcol.is-drop-blocked::after {
  content: attr(data-hint);
  position: absolute;
  inset: auto var(--s2) var(--s2);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-sm);
  background: var(--danger-soft);
  color: var(--danger-text);
  font-size: 12px;
  font-weight: 600;
  pointer-events: none;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: var(--s2) var(--s3);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface);
  transition: border-color var(--ease);
}

.card:hover {
  border-color: var(--border-strong);
}

.card[draggable="true"] {
  cursor: grab;
}

.card.is-dragging {
  opacity: 0.45;
}

.card--readonly {
  background: var(--surface-2);
}

.card__top,
.card__meta,
.card__actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s1) var(--s2);
}

.card__title {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text);
  font-weight: 600;
  text-align: left;
}

.card__title:hover {
  color: var(--primary-text);
}

.who {
  color: var(--text-2);
  font-size: 12px;
}

.who b {
  margin-right: 2px;
  color: var(--text-3);
  font-size: 11px;
  letter-spacing: 0.04em;
}

.who--none {
  color: var(--text-3);
  font-style: italic;
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s3);
  margin: var(--s6) auto;
  max-width: 520px;
  padding: var(--s5);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--text-2);
  text-align: center;
}

.empty h3 {
  color: var(--text);
  font-size: 15px;
}

/* ───────────── tables ───────────── */
.tablewrap {
  flex: 1;
  min-height: 0;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--surface);
}

.tablewrap--inline {
  flex: none;
}

.tbl {
  width: 100%;
  border-collapse: collapse;
}

.tbl th,
.tbl td {
  padding: var(--s2) var(--s3);
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}

.tbl th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
}

.tbl tbody tr:hover {
  background: var(--hover);
}

.tbl tbody tr:last-child td {
  border-bottom: 0;
}

.cell-title {
  min-width: 220px;
  max-width: 420px;
}

.empty-cell {
  padding: var(--s5) !important;
  color: var(--text-3);
  text-align: center !important;
}

/* ───────────── panels / forms ───────────── */
.panel {
  flex: none;
  padding: var(--s4);
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--surface);
}

.panel--narrow {
  width: 100%;
  max-width: 760px;
}

.panel__head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--s3);
  margin-bottom: var(--s3);
}

.panel .tablewrap {
  border-radius: var(--r-sm);
}

.note {
  margin-top: var(--s3);
  color: var(--text-2);
}

.note + .stack {
  margin-top: var(--s4);
}

.note--warn {
  padding: var(--s2) var(--s3);
  border-radius: var(--r-sm);
  background: var(--warn-soft);
  color: var(--text);
}

.cap-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--s3);
}

.cap {
  padding: var(--s3);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-2);
}

.cap__head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s1) var(--s2);
  margin-bottom: var(--s2);
}

.bar {
  height: 8px;
  border-radius: 999px;
  background: var(--neutral-soft);
  overflow: hidden;
}

.bar__fill {
  height: 100%;
  border-radius: 999px;
  background: var(--ok);
}

.bar__fill--warn {
  background: var(--warn);
}

.bar__fill--danger {
  background: var(--danger);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: var(--s3);
  align-items: start;
}

.form-grid--2 {
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
}

.field {
  display: flex;
  flex-direction: column;
  gap: var(--s1);
  min-width: 0;
}

.field > span {
  color: var(--text-2);
  font-size: 12px;
  font-weight: 600;
}

.field .input,
.field .select {
  width: 100%;
}

.field .row .input--num {
  flex: 1;
}

.field--action {
  align-self: end;
}

.field__err {
  color: var(--danger-text);
  font-size: 12px;
  font-weight: 600;
}

.fieldset {
  margin: 0;
  padding: var(--s2) var(--s3);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
}

.fieldset legend {
  padding: 0 var(--s1);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 600;
}

/* ───────────── drawer ───────────── */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  justify-content: flex-end;
  background: var(--scrim);
}

.drawer {
  display: flex;
  flex-direction: column;
  width: min(540px, 100%);
  height: 100%;
  border-left: 1px solid var(--border);
  background: var(--surface);
  box-shadow: var(--shadow-pop);
  animation: drawer-in 160ms ease-out;
}

@keyframes drawer-in {
  from {
    transform: translateX(24px);
    opacity: 0;
  }
}

.drawer__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s3);
  padding: var(--s4);
  border-bottom: 1px solid var(--border);
}

.drawer__heading {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  min-width: 0;
}

.drawer__heading h2 {
  font-size: 16px;
  overflow-wrap: anywhere;
}

.drawer__body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  padding: var(--s4);
  overflow-y: auto;
}

.drawer__foot {
  display: flex;
  justify-content: space-between;
  gap: var(--s3);
  padding: var(--s2) var(--s4);
  border-top: 1px solid var(--border);
  font-size: 12px;
}

.pathbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-2);
}

.next {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--s2);
  padding: var(--s3);
  border: 1px solid var(--primary);
  border-radius: var(--r-sm);
  background: var(--primary-soft);
  color: var(--primary-text);
  font-weight: 600;
}

.eyebrow {
  margin-bottom: var(--s2);
  color: var(--text-3);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.md {
  margin: 0;
  max-height: 46vh;
  padding: var(--s3);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow: auto;
  overflow-wrap: anywhere;
}

/* ───────────── toast ───────────── */
.toasts {
  position: fixed;
  left: 50%;
  bottom: var(--s5);
  z-index: 60;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100vw - 2 * var(--s4));
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s2) var(--s2) var(--s2) var(--s4);
  border: 1px solid var(--border-strong);
  border-left-width: 4px;
  border-left-color: var(--ok);
  border-radius: var(--r-sm);
  background: var(--surface);
  box-shadow: var(--shadow-pop);
  font-weight: 600;
  pointer-events: auto;
}

.toast--err {
  border-left-color: var(--danger);
}

/* ───────────── responsive & a11y ───────────── */
@media (max-width: 720px) {
  .topbar {
    padding: var(--s2) var(--s3);
  }

  .tools {
    margin-left: 0;
  }

  .search,
  .search .input {
    width: 100%;
  }

  .toolbar__count {
    margin-left: 0;
  }

  .main {
    padding: var(--s3);
  }

  .kcol {
    flex-basis: 84vw;
  }

  .kcol--rail {
    flex-basis: 44px;
  }

  .kgrid {
    scroll-snap-type: x proximity;
  }

  .kcol {
    scroll-snap-align: start;
  }
}

@media (pointer: coarse) {
  :root {
    --control-h: 44px;
  }

  .btn--sm,
  .input--sm,
  .select--sm {
    min-height: 40px;
  }

  .btn--icon.btn--sm {
    width: 40px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

  <script>window.__BOARD_STATE__ = {"updatedAt":"2026-11-05T00:14:12.272Z","columns":["BACKLOG","READY_FOR_DEV","IN_PROGRESS","PENDING_BA","PENDING_TL","READY_FOR_QA","IN_DEV_FIX","IN_RETEST","DONE"],"activeSprint":"SPRINT-01","roster":[{"member":"@tl-1","name":"Tech Lead","role":"tl","capacitySp":10,"specialties":"Architecture","status":"Active"}],"capacity":{"sprintId":"SPRINT-01","members":[{"member":"@tl-1","name":"Tech Lead","role":"tl","capacitySp":10,"specialties":"Architecture","status":"OK","assignedSp":0}],"rolloverQaTickets":[]},"items":[{"id":"03","rawFileId":"03-teacher-assignment","type":"TICKET","slug":"mvp-core","status":"BACKLOG","title":"03: Phân công giáo viên vào lớp (3 GV/lớp, vai trò chủ nhiệm/hỗ trợ)","sprint":"BACKLOG","sprintTarget":"DONE","sprintGoalMet":false,"devAssignee":"@unassigned","qaAssignee":"@unassigned","totalSp":0,"devSp":0,"qaSp":0,"body":"# 03: Phân công giáo viên vào lớp (3 GV/lớp, vai trò chủ nhiệm/hỗ trợ)\n\n**Serves:** REQ-6, REQ-9 (spec mvp-core) — thực thi D-02, D-05\n- Estimate: 0 SP (DEV: 0 SP | QA: 0 SP)\n- Feature ID: F-001\n- Sprint: BACKLOG\n- Sprint Target: DONE\n- Dev Assignee: @unassigned\n- QA Assignee: @unassigned\n- Estimate (optional): 8 SP (DEV: 5 SP | QA: 3 SP)\n\n**What to build:** Nghiệp vụ phân công giáo viên vào lớp với vai trò Homeroom/Support, thực thi bất biến: mỗi lớp tối đa 3 giáo viên, đúng 1 chủ nhiệm, 1 giáo viên chủ nhiệm tối đa 1 lớp; cảnh báo thiếu giáo viên.\n\n**Blocked by:** 01, 02 (cần Class và Teacher tồn tại).\n\n**Interfaces:**\n- Consumes: `Class` (ticket 01), `Teacher` (ticket 02); `Result\u003cT>`/`Error`; `IApplicationDbContext`.\n- Produces: entity `ClassAssignment` + `AssignTeacherCommand`, `RemoveTeacherAssignmentCommand`; bất biến số lượng/vai trò nằm trong aggregate `Class`.\n\n**Out of scope:** xếp học sinh (ticket 05). Regression boundary: Class CRUD và Teacher CRUD không đổi quy tắc đã có.\n\n**Plan & Verification:**\n- Seam & Failing Test: `dotnet test tests/SmartKMS.Application.UnitTests --filter \"FullyQualifiedName~AssignTeacher\"` (RED).\n- Review Focus Pinned: lớp đã có chủ nhiệm nhưng gán thêm chủ nhiệm -> chặn; một GV chủ nhiệm 2 lớp -> chặn.\n- Micro-Step 1: test fail AssignTeacher (gán happy path 3 GV) -> pass.\n- Micro-Step 2: edge (gán GV thứ 4, gán chủ nhiệm thứ 2, chủ nhiệm 2 lớp) -> pass.\n- Micro-Step 3: dọn dẹp, diff sạch.\n- Verify Command: `dotnet test tests/SmartKMS.Application.UnitTests/SmartKMS.Application.UnitTests.csproj --filter \"FullyQualifiedName~AssignTeacher\" && dotnet build SmartKMS.sln`\n\n**Quality Gates:**\n- Commands: build; Application.UnitTests `--filter \"FullyQualifiedName~AssignTeacher\"`; ArchitectureTests; format.\n- Evidence: `board/features/mvp-core/verification.md` — hàng phân công giáo viên.\n- UI flows: `e2e/mvp-core.spec.ts` — \"phân công & chặn GV thứ 4/chủ nhiệm trùng\".\n\n**Status:** BACKLOG\n\n**Acceptance (Capability & Regression Evals):**\n- [ ] [Capability] Given lớp còn chỗ và GV chưa chủ nhiệm lớp khác, When gán giáo viên với vai trò Homeroom/Support, Then phân công thành công và thấy trong danh sách lớp.\n  - Fails when: phân công thất bại dù thỏa điều kiện.\n- [ ] [Capability / Review Focus] Given lớp đã đủ 3 giáo viên, When gán thêm giáo viên thứ 4, Then bị chặn bằng `Error.Validation`.\n  - Fails when: cho phép 4 giáo viên trong một lớp.\n- [ ] [Capability / Review Focus] Given lớp đã có chủ nhiệm, When gán thêm chủ nhiệm, Then bị chặn bằng `Error.Validation`.\n  - Fails when: lớp có 2 chủ nhiệm.\n- [ ] [Capability / Review Focus] Given một giáo viên đang chủ nhiệm lớp A, When phân công chủ nhiệm lớp B, Then bị chặn bằng `Error.Validation`.\n  - Fails when: một GV chủ nhiệm 2 lớp.\n- [ ] [Capability] Given lớp có 1–2 giáo viên, When xem trạng thái, Then cảnh báo \"thiếu giáo viên\".\n  - Fails when: không phát sinh cảnh báo cho lớp dưới 3 GV.\n- [ ] [Regression] Given phân công hợp lệ, When chạy lại test Class/Teacher, Then vẫn green.\n  - Fails when: ArchitectureTests/buôn báo lỗi.\n","file":"board/features/mvp-core/tickets/03-teacher-assignment.md"},{"id":"05","rawFileId":"05-child-enrollment","type":"TICKET","slug":"mvp-core","status":"BACKLOG","title":"05: Xếp lớp & chuyển lớp học sinh (sĩ số 30, cảnh báo độ tuổi, lịch sử)","sprint":"BACKLOG","sprintTarget":"DONE","sprintGoalMet":false,"devAssignee":"@unassigned","qaAssignee":"@unassigned","totalSp":0,"devSp":0,"qaSp":0,"body":"# 05: Xếp lớp & chuyển lớp học sinh (sĩ số 30, cảnh báo độ tuổi, lịch sử)\n\n**Serves:** REQ-13, REQ-14 (spec mvp-core) — thực thi D-02 sĩ số, D-09 độ tuổi, D-06 chuyển lớp\n- Feature ID: F-001\n- Sprint: BACKLOG\n- Sprint Target: DONE\n- Dev Assignee: @unassigned\n- QA Assignee: @unassigned\n- Estimate (optional): 8 SP (DEV: 5 SP | QA: 3 SP)\n\n**What to build:** Nghiệp vụ xếp học sinh vào lớp (chặn khi lớp đủ 30 bằng `Error.Conflict`, cảnh báo không chặn khi lệch độ tuổi khối) và chuyển lớp giữa năm (có lịch sử lớp đã học, chặn khi lớp đích đủ 30).\n\n**Blocked by:** 01, 04 (cần Class và Child).\n\n**Interfaces:**\n- Consumes: `Class` (ticket 01), `Child` (ticket 04); `Result\u003cT>`/`Error`; `IApplicationDbContext`.\n- Produces: entity `ChildEnrollment` + `EnrollChildCommand`, `TransferChildCommand`; bất biến sĩ số nằm trong aggregate `Class`.\n\n**Out of scope:** lên khối cuối năm & quản lý năm học (GĐ4). Regression boundary: Class/Child CRUD không đổi.\n\n**Plan & Verification:**\n- Seam & Failing Test: `dotnet test tests/SmartKMS.Application.UnitTests --filter \"FullyQualifiedName~EnrollChild\"` (RED).\n- Review Focus Pinned: lớp đủ 30 vẫn xếp -> chặn Conflict; xếp lệch độ tuổi -> cảnh báo nhưng thành công; chuyển vào lớp đầy -> chặn.\n- Micro-Step 1: test fail EnrollChild (hợp lệ) -> pass.\n- Micro-Step 2: edge (đủ 30, lệch tuổi, chuyển vào lớp đầy) -> pass.\n- Micro-Step 3: dọn dẹp, diff sạch.\n- Verify Command: `dotnet test tests/SmartKMS.Application.UnitTests/SmartKMS.Application.UnitTests.csproj --filter \"FullyQualifiedName~EnrollChild\\|TransferChild\" && dotnet build SmartKMS.sln`\n\n**Quality Gates:**\n- Commands: build; Application.UnitTests `--filter \"FullyQualifiedName~EnrollChild\\|TransferChild\"`; ArchitectureTests; format.\n- Evidence: `board/features/mvp-core/verification.md` — hàng xếp lớp/chuyển lớp.\n- UI flows: `e2e/mvp-core.spec.ts` — \"xếp lớp & chặn lớp đầy & chuyển lớp có lịch sử\".\n\n**Status:** BACKLOG\n\n**Acceptance (Capability & Regression Evals):**\n- [ ] [Capability] Given lớp còn chỗ (\u003c30), When xếp học sinh vào lớp, Then thành công và trẻ hiển thị trong lớp.\n  - Fails when: xếp thất bại dù còn chỗ.\n- [ ] [Capability / Review Focus] Given lớp đã đủ 30, When xếp thêm, Then bị chặn bằng `Error.Conflict`.\n  - Fails when: xếp vào lớp đầy vẫn thành công.\n- [ ] [Capability / Review Focus] Given trẻ không khớp độ tuổi khối, When xếp vào lớp, Then cảnh báo nhưng vẫn thành công.\n  - Fails when: xếp lệch tuổi bị chặn cứng (trái D-09).\n- [ ] [Capability] Given học sinh ở lớp A, When chuyển sang lớp B còn chỗ, Then chuyển thành công và lưu lịch sử lớp đã học.\n  - Fails when: lịch sử lớp đã học bị mất.\n- [ ] [Capability / Review Focus] Given học sinh chuyển vào lớp B đã đủ 30, Then bị chặn bằng `Error.Conflict`.\n  - Fails when: chuyển vào lớp đầy vẫn thành công.\n- [ ] [Regression] Given Class/Child đã có, When chạy test Class/Child, Then vẫn green.\n  - Fails when: ArchitectureTests/build báo lỗi.\n","file":"board/features/mvp-core/tickets/05-child-enrollment.md"},{"id":"06","rawFileId":"06-dashboard","type":"TICKET","slug":"mvp-core","status":"BACKLOG","title":"06: Dashboard tổng quan & cảnh báo nghiệp vụ","sprint":"BACKLOG","sprintTarget":"DONE","sprintGoalMet":false,"devAssignee":"@unassigned","qaAssignee":"@unassigned","totalSp":0,"devSp":0,"qaSp":0,"body":"# 06: Dashboard tổng quan & cảnh báo nghiệp vụ\n\n**Serves:** REQ-17 (spec mvp-core) — thực thi D-02, D-08\n- Feature ID: F-001\n- Sprint: BACKLOG\n- Sprint Target: DONE\n- Dev Assignee: @unassigned\n- QA Assignee: @unassigned\n- Estimate (optional): 4 SP (DEV: 2 SP | QA: 2 SP)\n\n**What to build:** Màn hình tổng quan hiển thị tổng số lớp/giáo viên/học sinh, sĩ số theo từng khối, và danh sách cảnh báo (lớp thiếu giáo viên, lớp gần đầy 28–29/30, lớp đã đầy 30/30).\n\n**Blocked by:** 01, 03 (cần dữ liệu lớp + phân công để có cảnh báo thiếu GV).\n\n**Interfaces:**\n- Consumes: `Class`, `Teacher`, `Child`, `ClassAssignment`, `ChildEnrollment`; `Result\u003cT>`/`Error`; `IApplicationDbContext`; `PageHeader`, MudBlazor primitives, `KindergartenTheme`.\n- Produces: `DashboardQuery` (read model tổng hợp).\n\n**Out of scope:** báo cáo nâng cao, biểu đồ chuyên cần/chuyên thu (GĐ3/4). Regression boundary: không đổi logic module khác.\n\n**Plan & Verification:**\n- Seam & Failing Test: `dotnet test tests/SmartKMS.Application.UnitTests --filter \"FullyQualifiedName~Dashboard\"` (RED).\n- Review Focus Pinned: lớp ≥28/30 phải xuất hiện trong cảnh báo tương ứng.\n- Micro-Step 1: test fail Dashboard (số liệu tổng) -> pass.\n- Micro-Step 2: edge (ngưỡng 28 gần đầy, 30 đã đầy, thiếu GV) -> pass.\n- Micro-Step 3: dọn dẹp, diff sạch.\n- Verify Command: `dotnet test tests/SmartKMS.Application.UnitTests/SmartKMS.Application.UnitTests.csproj --filter \"FullyQualifiedName~Dashboard\" && dotnet build SmartKMS.sln`\n\n**Quality Gates:**\n- Commands: build; Application.UnitTests `--filter \"FullyQualifiedName~Dashboard\"`; ArchitectureTests; format.\n- Evidence: `board/features/mvp-core/verification.md` — hàng dashboard.\n- UI flows: `e2e/mvp-core.spec.ts` — \"xem dashboard tổng quan & cảnh báo\".\n\n**Status:** BACKLOG\n\n**Acceptance (Capability & Regression Evals):**\n- [ ] [Capability] Given dữ liệu trường đã có, When mở dashboard, Then hiển thị tổng số lớp, giáo viên, học sinh đúng và sĩ số theo từng khối.\n  - Fails when: số liệu thống kê sai lệch.\n- [ ] [Capability / Review Focus] Given lớp đạt 28–29/30, When xem cảnh báo, Then xuất hiện \"gần đầy\".\n  - Fails when: lớp ≥28 không xuất hiện cảnh báo gần đầy tương ứng.\n- [ ] [Capability / Review Focus] Given lớp đủ 30/30, When xem cảnh báo, Then xuất hiện \"đã đầy\".\n  - Fails when: lớp 30/30 không xuất hiện cảnh báo đã đầy.\n- [ ] [Capability] Given lớp có 1–2 giáo viên, When xem cảnh báo, Then xuất hiện \"thiếu giáo viên\".\n  - Fails when: không phát sinh cảnh báo thiếu giáo viên.\n- [ ] [Regression] Given module Classes/Teachers, When chạy test, Then vẫn green.\n  - Fails when: ArchitectureTests/build báo lỗi.\n","file":"board/features/mvp-core/tickets/06-dashboard.md"},{"id":"02","rawFileId":"02-teacher-crud","type":"TICKET","slug":"mvp-core","status":"READY_FOR_DEV","title":"02: Quản lý giáo viên (CRUD + ngừng công tác)","sprint":"BACKLOG","sprintTarget":"DONE","sprintGoalMet":false,"devAssignee":"@tl-1","qaAssignee":"@unassigned","totalSp":2,"devSp":2,"qaSp":0,"body":"# 02: Quản lý giáo viên (CRUD + ngừng công tác)\n\n**Serves:** REQ-7, REQ-8, REQ-10, REQ-11 (spec mvp-core)\n- Estimate: 2 SP (DEV: 2 SP | QA: 0 SP)\n- Feature ID: F-001\n- Sprint: BACKLOG\n- Sprint Target: DONE\n- Dev Assignee: @tl-1\n- QA Assignee: @unassigned\n- Estimate (optional): 6 SP (DEV: 4 SP | QA: 2 SP)\n\n**What to build:** Màn hình hồ sơ giáo viên cho phép tạo (họ tên, ngày sinh, liên hệ, trình độ, ngày vào trường, trạng thái), sửa, ngừng công tác (soft-close), xem danh sách lớp phụ trách, và tìm kiếm/lọc theo trạng thái/lớp/khối.\n\n**Blocked by:** None (danh sách lớp phụ trách có thể trống trước khi có ticket 03).\n\n**Interfaces:**\n- Consumes: `Result\u003cT>`/`Error`; `IApplicationDbContext`; `PageHeader`, `DataTable\u003cTItem>`, `EmptyState`, `ConfirmDialog`, MudBlazor primitives.\n- Produces: `Teacher` aggregate + `CreateTeacherCommand`, `UpdateTeacherCommand`, `WithdrawTeacherCommand`, `ListTeachersQuery`, `GetTeacherAssignmentsQuery`.\n\n**Out of scope:** Phân công giáo viên vào lớp (ticket 03). Regression boundary: module Classes (ticket 01) không đổi.\n\n**Plan & Verification:**\n- Seam & Failing Test: `dotnet test tests/SmartKMS.Application.UnitTests --filter \"FullyQualifiedName~CreateTeacher\"` (RED).\n- Review Focus Pinned: một giáo viên chủ nhiệm 2 lớp -> chặn (chốt tại ticket 03; ở đây kiểm tra dữ liệu hồ sơ đúng).\n- Micro-Step 1: test fail CreateTeacher -> pass.\n- Micro-Step 2: edge (thiếu họ tên/ngày sinh, ngừng công tác không xóa) -> pass.\n- Micro-Step 3: dọn dẹp, diff sạch.\n- Verify Command: `dotnet test tests/SmartKMS.Application.UnitTests/SmartKMS.Application.UnitTests.csproj --filter \"FullyQualifiedName~Teacher\" && dotnet build SmartKMS.sln`\n\n**Quality Gates:**\n- Commands: build; Application.UnitTests `--filter \"FullyQualifiedName~Teacher\"`; ArchitectureTests; format.\n- Evidence: `board/features/mvp-core/verification.md` — hàng Teacher CRUD.\n- UI flows: `e2e/mvp-core.spec.ts` — \"tạo giáo viên & ngừng công tác\".\n\n**Status:** READY_FOR_DEV\n\n**Acceptance (Capability & Regression Evals):**\n- [ ] [Capability] Given biểu mẫu giáo viên hợp lệ, When gửi tạo, Then hồ sơ lưu đủ họ tên, ngày sinh, liên hệ, trình độ, ngày vào trường, trạng thái làm việc.\n  - Fails when: thiếu họ tên hoặc ngày sinh.\n- [ ] [Capability] Given một giáo viên, When ngừng công tác, Then trạng thái đổi mà không xóa khỏi lịch sử phân công.\n  - Fails when: giáo viên biến mất khỏi danh sách/lịch sử.\n- [ ] [Capability] Given một giáo viên, When xem danh sách lớp phụ trách, Then liệt kê các lớp chủ nhiệm + hỗ trợ.\n  - Fails when: danh sách lớp thiếu phân công (trống hợp lệ trước ticket 03).\n- [ ] [Capability] Given danh sách giáo viên, When lọc theo trạng thái/lớp/khối, Then kết quả khớp tiêu chí.\n  - Fails when: kết quả lọc không khớp.\n- [ ] [Regression] Given module Classes (ticket 01), When chạy test Class, Then vẫn green.\n  - Fails when: ArchitectureTests/buôn báo lỗi.\n","file":"board/features/mvp-core/tickets/02-teacher-crud.md"},{"id":"04","rawFileId":"04-child-crud","type":"TICKET","slug":"mvp-core","status":"READY_FOR_DEV","title":"04: Quản lý học sinh (CRUD + thôi học)","sprint":"BACKLOG","sprintTarget":"DONE","sprintGoalMet":false,"devAssignee":"@tl-1","qaAssignee":"@unassigned","totalSp":2,"devSp":2,"qaSp":0,"body":"# 04: Quản lý học sinh (CRUD + thôi học)\n\n**Serves:** REQ-12, REQ-15, REQ-16 (spec mvp-core)\n- Estimate: 2 SP (DEV: 2 SP | QA: 0 SP)\n- Feature ID: F-001\n- Sprint: BACKLOG\n- Sprint Target: DONE\n- Dev Assignee: @tl-1\n- QA Assignee: @unassigned\n- Estimate (optional): 6 SP (DEV: 4 SP | QA: 2 SP)\n\n**What to build:** Màn hình hồ sơ học sinh cho phép tạo (họ tên, ngày sinh, giới tính, thông tin phụ huynh, địa chỉ, ngày nhập học, trạng thái), sửa, thôi học (soft-close), xem bạn cùng lớp + giáo viên phụ trách (trống trước ticket 05), và tìm kiếm/lọc theo lớp/khối/trạng thái.\n\n**Blocked by:** None (xem bạn cùng lớp/giáo viên có thể trống trước ticket 05/03).\n\n**Interfaces:**\n- Consumes: `Result\u003cT>`/`Error`; `IApplicationDbContext`; `PageHeader`, `DataTable\u003cTItem>`, `EmptyState`, `ConfirmDialog`, MudBlazor primitives.\n- Produces: `Child` aggregate + `CreateChildCommand`, `UpdateChildCommand`, `WithdrawChildCommand`, `ListChildrenQuery`, `GetChildContextQuery` (bạn cùng lớp + giáo viên).\n\n**Out of scope:** xếp lớp và chuyển lớp (ticket 05). Regression boundary: Teacher/Class không đổi.\n\n**Plan & Verification:**\n- Seam & Failing Test: `dotnet test tests/SmartKMS.Application.UnitTests --filter \"FullyQualifiedName~CreateChild\"` (RED).\n- Review Focus Pinned: (không có chặn cứng ở CRUD; chặn tại ticket 05).\n- Micro-Step 1: test fail CreateChild -> pass.\n- Micro-Step 2: edge (thiếu họ tên/ngày sinh, thôi học không xóa) -> pass.\n- Micro-Step 3: dọn dẹp, diff sạch.\n- Verify Command: `dotnet test tests/SmartKMS.Application.UnitTests/SmartKMS.Application.UnitTests.csproj --filter \"FullyQualifiedName~Child\" && dotnet build SmartKMS.sln`\n\n**Quality Gates:**\n- Commands: build; Application.UnitTests `--filter \"FullyQualifiedName~Child\"`; ArchitectureTests; format.\n- Evidence: `board/features/mvp-core/verification.md` — hàng Child CRUD.\n- UI flows: `e2e/mvp-core.spec.ts` — \"tạo học sinh & thôi học\".\n\n**Status:** READY_FOR_DEV\n\n**Acceptance (Capability & Regression Evals):**\n- [ ] [Capability] Given biểu mẫu học sinh hợp lệ, When gửi tạo, Then hồ sơ lưu đủ họ tên, ngày sinh, giới tính, phụ huynh, địa chỉ, ngày nhập học, trạng thái.\n  - Fails when: thiếu họ tên hoặc ngày sinh.\n- [ ] [Capability] Given một học sinh, When thôi học, Then trạng thái đổi mà không xóa khỏi lịch sử.\n  - Fails when: học sinh biến mất khỏi dữ liệu.\n- [ ] [Capability] Given một học sinh có lớp, When xem chi tiết, Then hiển thị lớp hiện tại, bạn cùng lớp, giáo viên phụ trách.\n  - Fails when: danh sách hiển thị sai (trống hợp lệ trước ticket 03/05).\n- [ ] [Capability] Given danh sách học sinh, When lọc theo lớp/khối/trạng thái, Then kết quả khớp tiêu chí.\n  - Fails when: kết quả lọc không khớp.\n- [ ] [Regression] Given module Classes/Teachers, When chạy test Class/Teacher, Then vẫn green.\n  - Fails when: ArchitectureTests/build báo lỗi.\n","file":"board/features/mvp-core/tickets/04-child-crud.md"},{"id":"01","rawFileId":"01-class-crud","type":"TICKET","slug":"mvp-core","status":"IN_PROGRESS","title":"01: Quản lý lớp học (CRUD + đóng lớp)","sprint":"BACKLOG","sprintTarget":"DONE","sprintGoalMet":false,"devAssignee":"@tl-1","qaAssignee":"@unassigned","totalSp":2,"devSp":2,"qaSp":0,"body":"# 01: Quản lý lớp học (CRUD + đóng lớp)\r\n\r\n**Serves:** REQ-1, REQ-2, REQ-3, REQ-4, REQ-5 (spec mvp-core)\r\n- Estimate: 2 SP (DEV: 2 SP | QA: 0 SP)\r\n- Feature ID: F-001\r\n- Sprint: BACKLOG\r\n- Sprint Target: DONE\r\n- Dev Assignee: @tl-1\r\n- QA Assignee: @unassigned\r\n- Estimate (optional): 8 SP (DEV: 5 SP | QA: 3 SP)\r\n\r\n**What to build:** Màn hình danh sách lớp học cho phép tạo, xem danh sách (lọc theo khối/năm học), xem chi tiết (danh sách giáo viên + học sinh + chỗ trống), cập nhật tên/phòng, và đóng lớp (soft-close).\r\n\r\n**Blocked by:** None\r\n\r\n**Interfaces:**\r\n- Consumes: `Result\u003cT>`/`Error` (AD-1); `IApplicationDbContext`; `PageHeader`, `DataTable\u003cTItem>`, `EmptyState`, `ConfirmDialog`, MudBlazor primitives (Reuse từ spec `## Existing Reusable Components`).\r\n- Produces: `Class` aggregate + `CreateClassCommand/Query`, `ListClassesQuery`, `GetClassDetailQuery`, `UpdateClassCommand`, `CloseClassCommand`; giá trị `AgeGroup` (Mầm/Chồi/Lá) tái sử dụng từ GLOSSARY.\r\n\r\n**Out of scope:** Phân công giáo viên vào lớp (ticket 03); xếp học sinh vào lớp (ticket 05). Regression boundary: `Home.razor` và scaffold Sprint 0 không đổi.\r\n\r\n**Plan & Verification:**\r\n- Seam & Failing Test: `dotnet test tests/SmartKMS.Application.UnitTests --filter \"FullyQualifiedName~CreateClass\"` (RED vì handler chưa có).\r\n- Review Focus Pinned: lớp đóng (Closed) vẫn nhận học sinh/giáo viên mới -> chặn.\r\n- Micro-Step 1: viết test fail cho CreateClass -> cài handler làm pass.\r\n- Micro-Step 2: thêm edge (tên lớp trùng cùng khối+năm học, thiếu trường bắt buộc) -> pass.\r\n- Micro-Step 3: dọn dẹp, xác nhận diff sạch.\r\n- Verify Command: `dotnet test tests/SmartKMS.Application.UnitTests/SmartKMS.Application.UnitTests.csproj --filter \"FullyQualifiedName~Class\" && dotnet build SmartKMS.sln`\r\n\r\n**Quality Gates:**\r\n- Trace to the spec's `## Quality Gate Plan`: build + Application.UnitTests + ArchitectureTests + format.\r\n- Commands: `dotnet build SmartKMS.sln`; `dotnet test tests/SmartKMS.Application.UnitTests/SmartKMS.Application.UnitTests.csproj --filter \"FullyQualifiedName~Class\"`; `dotnet test tests/SmartKMS.ArchitectureTests/SmartKMS.ArchitectureTests.csproj --filter \"FullyQualifiedName~CleanArchitectureRulesTests\"`; `dotnet format SmartKMS.sln --verify-no-changes`.\r\n- Evidence: `board/features/mvp-core/verification.md` — hàng Class CRUD.\r\n- UI flows: `e2e/mvp-core.spec.ts` — \"tạo lớp & xem danh sách & đóng lớp\".\r\n\r\n**Status:** IN_PROGRESS\r\n- Plan-Approved: true (approved by: user via interactive gate 2026-11-05)\r\n\r\n## Technical Plan\r\n\r\n### Grilling Alignment (Two-Axis, đã chốt với user 2026-11-05)\r\n\r\n- **G1 (DB env):** Không dùng PostgreSQL nội bộ máy — toàn bộ DB chạy **Docker** (`docker-compose.yml`, image `postgres:17`). `scripts/run-e2e-server.ps1` quản lý vòng đời: pre-flight port check → `docker compose up -d db` (wait healthy) → migration → web server ephemeral → test → teardown (`docker compose down` + taskkill process tree). Connection string truyền qua env var `ConnectionStrings__DefaultConnection` lúc chạy (không sửa `appsettings.json`, không commit mật khẩu thật; mật khẩu dev cục bộ `smartkms_dev` chỉ nằm trong compose file).\r\n- **G2 (EF tooling):** Tool manifest `.config/dotnet-tools.json` pin `dotnet-ef` **10.0.4** (khớp EF Core 10.0.4); `dotnet tool restore` trước khi tạo migration.\r\n- **G3 (Nav):** Thêm `MudNavLink Href=\"/classes\"` + `data-testid=\"nav-classes\"` vào `NavMenu.razor`. `Home.razor` KHÔNG đổi (regression boundary).\r\n- **G4 (AgeGroup):** Enum `AgeGroup` 3 giá trị `Mam`/`Choi`/`La` (Mầm/Chồi/Lá) — đúng spec frozen cho Lớp học; nhóm nhà trẻ bổ sung sau.\r\n- **Zero-ambiguity readings từ ACs (không cần hỏi):** bộ lọc trạng thái 3 mức (Tất cả/Đang hoạt động/Đã đóng — suy từ REQ-5 \"lọc 'đã đóng'\"); năm học regex `^\\d{4}-\\d{4}$`; unique (tên, khối, năm học); `MaxStudents = 30` hằng số trên aggregate; `Room` KHÔNG bắt buộc (REQ-1 liệt kê \"thiếu trường bắt buộc (tên/khối/năm học)\" — không gồm phòng); Update chỉ đổi tên/phòng (AC-4), khối/năm học bất biến; Close idempotent (đóng lớp đã đóng → success, không mất dữ liệu); sửa lớp đã đóng vẫn cho phép (AC không cấm — guard phân công thuộc ticket 03/05); detail hiển thị 0 giáo viên/0 học sinh/30 chỗ trống vì ClassAssignment/ChildEnrollment chưa tồn tại tới ticket 03/05 (spec-review đã chốt danh sách hợp lệ là trống).\r\n\r\n### Component Breakdown & Surgical Footprint\r\n\r\n**Domain** (`src/SmartKMS.Domain/Modules/Classes/`):\r\n- `AgeGroup.cs` — enum Mam/Choi/La.\r\n- `ClassStatus.cs` — enum Active/Closed.\r\n- `Class.cs` — aggregate root: factory `Create(name, ageGroup, academicYear, room)`, `Rename(name, room)`, `Close()`, `public const int MaxStudents = 30`; status mặc định Active.\r\n\r\n**Application** (`src/SmartKMS.Application/Modules/Classes/`):\r\n- `Dtos/ClassSummaryDto.cs` — Id, Name, AgeGroup, AcademicYear, Room, Status, StudentCount, MaxStudents.\r\n- `Dtos/ClassDetailDto.cs` — + Teachers (rỗng), Children (rỗng), VacantSlots (= MaxStudents − StudentCount).\r\n- `Commands/CreateClass/CreateClassCommand.cs` (+ Handler + Validator).\r\n- `Commands/UpdateClass/UpdateClassCommand.cs` (Id, Name, Room) (+ Handler + Validator).\r\n- `Commands/CloseClass/CloseClassCommand.cs` (+ Handler).\r\n- `Queries/ListClasses/ListClassesQuery.cs` (AgeGroup?, AcademicYear?, Status?) (+ Handler).\r\n- `Queries/GetClassDetail/GetClassDetailQuery.cs` (Id) (+ Handler).\r\n- `Mapping/ClassMapper.cs` — Riok.Mapperly (đã pin 4.3.1).\r\n\r\n**Infrastructure:**\r\n- `Persistence/Configurations/ClassConfiguration.cs` — bảng `classes`, PK `pk_classes`, unique index `uq_classes_name_agegroup_year` (name, age_group, academic_year), enum → string conversion, name ≤100 NOT NULL, academic_year ≤9 NOT NULL, room ≤50 NULL.\r\n- `Persistence/ApplicationDbContext.cs` — thêm `DbSet\u003cClass> Classes` (sửa 1 dòng).\r\n- `Persistence/Migrations/*InitialCreate*` — migration đầu tiên (Identity + classes), tạo bằng dotnet-ef từ tool manifest.\r\n\r\n**Web:**\r\n- `Components/Pages/Classes/ClassesPage.razor` — `@page \"/classes\"`: bộ lọc khối/năm học/trạng thái + `DataTable` + nút Tạo lớp + hành động Sửa/Đóng/Xem; `data-testid`: `class-create-button`, `class-agegroup-filter`, `class-year-filter`, `class-status-filter`, `class-row-*`, `class-close-button`.\r\n- `Components/Pages/Classes/ClassDetailPage.razor` — `@page \"/classes/{Id:guid}\"`: thông tin lớp + EmptyState danh sách giáo viên/học sinh + chỗ trống.\r\n- `Components/Pages/Classes/CreateClassDialog.razor` + `EditClassDialog.razor` — form tên/khối/năm học/phòng; `data-testid`: `class-name-input`, `class-agegroup-select`, `class-year-input`, `class-room-input`, `class-submit-button`.\r\n- `Components/Layout/NavMenu.razor` — +1 dòng nav link (sửa).\r\n\r\n**Tests:**\r\n- `tests/SmartKMS.Domain.UnitTests/Classes/ClassTests.cs` — factory/Close/Rename/MaxStudents.\r\n- `tests/SmartKMS.Application.UnitTests/Classes/TestApplicationDbContext.cs` — DbContext InMemory implement `IApplicationDbContext` (test double tại seam, spec Testing Decisions cho phép in-memory cho handler test).\r\n- `tests/SmartKMS.Application.UnitTests/Classes/{CreateClass,ListClasses,GetClassDetail,UpdateClass,CloseClass,Validators}Tests.cs`.\r\n- `tests/SmartKMS.Application.UnitTests/SmartKMS.Application.UnitTests.csproj` — thêm `Microsoft.EntityFrameworkCore.InMemory` 10.0.4 (NuGet chính chủ, khớp pin EF Core).\r\n\r\n**E2E & Infra:**\r\n- `docker-compose.yml` (root) — service `db` postgres:17, DB `smartkms`, user `postgres`, password `smartkms_dev`, healthcheck `pg_isready`.\r\n- `scripts/run-e2e-server.ps1` — supervisor ephemeral theo đúng hợp đồng skill.\r\n- `e2e/playwright.config.ts` — baseURL `http://localhost:5160` (override bằng env `E2E_BASE_URL`), reporter line.\r\n- `e2e/mvp-core.spec.ts` — happy path headed, `slowMo: 300`, assert circuit `/_blazor` 101 trước mọi tương tác.\r\n- `.config/dotnet-tools.json` — dotnet-ef 10.0.4.\r\n\r\n**Không đụng:** `Home.razor`, `appsettings.json`, scaffold Sprint 0 khác (Anti-Preemption). Cảnh báo CS0105 có sẵn ở `_Imports.razor:8` → queue `suggested-tasks.md`.\r\n\r\n### Data Flow & Schema Impact\r\n\r\n1. **Create:** Dialog → `ISender.Send(CreateClassCommand)` → `ValidationBehavior` (Name required ≤100; AcademicYear regex `^\\d{4}-\\d{4}$`; Room optional ≤50) → Handler: `AnyAsync` unique check (Name+AgeGroup+AcademicYear) → duplicate ⇒ `Result.Failure\u003cGuid>(Error.Validation(\"Class.DuplicateName\", …))` → `Class.Create` → Save → `Result\u003cGuid>` → snackbar thành công + reload list.\r\n2. **List:** Filters (khối/year/trạng thái, nullable = không lọc) → `ListClassesQuery` → `AsNoTracking` + `Where` tương ứng → `IReadOnlyList\u003cClassSummaryDto>`; StudentCount = 0 cho tới ticket 05.\r\n3. **Detail:** `GetClassDetailQuery` → NotFound ⇒ `Error.NotFound(\"Class.NotFound\", …)`; thành công ⇒ DTO với Teachers=[], Children=[], `VacantSlots = MaxStudents − StudentCount`.\r\n4. **Update:** (Id, Name, Room) → NotFound guard → duplicate check loại trừ chính nó → `Rename` → Save. Khối/năm học không đổi.\r\n5. **Close:** NotFound guard → `Close()` (idempotent) → Save.\r\n- DB unique index `uq_classes_name_agegroup_year` là defense-in-depth; đường lỗi nghiệp vụ qua handler check (testable ở unit test vì InMemory không enforce index).\r\n\r\n### Playwright E2E Happy Path Outline (headed, slowMo 300, circuit sync)\r\n\r\nEphemeral: `powershell -ExecutionPolicy Bypass -File scripts/run-e2e-server.ps1 -Port 5160 -TestCommand \"npx playwright test seed.spec.ts mvp-core.spec.ts --headed\"`\r\n\r\n1. `waitForResponse /_blazor 101` → click `nav-classes` → URL `/classes`, header \"Lớp học\".\r\n2. Click `class-create-button` → dialog visible → điền \"Lớp Lá A\" / khối \"Lá\" / \"2025-2026\" / \"Phòng 101\" → submit → hàng \"Lớp Lá A\" với \"0/30\" + \"Hoạt động\".\r\n3. Lọc khối \"Lá\" + năm \"2025-2026\" → hàng hiển thị; lọc khối \"Mầm\" → hàng biến mất (assert absence).\r\n4. Vào chi tiết → EmptyState giáo viên + học sinh + \"Chỗ trống: 30\".\r\n5. Sửa → đổi \"Lớp Lá A1\" / \"Phòng 102\" → hàng phản ánh tên mới.\r\n6. Đóng lớp → ConfirmDialog `confirm-dialog-ok` → chip \"Đã đóng\"; lọc trạng thái \"Đã đóng\" → hàng vẫn hiển thị (soft-close).\r\n7. Regression: `seed.spec.ts` green (Home \"Tổng quan\" không lỗi, NavMenu nguyên vẹn).\r\n\r\n### Unit Test Matrix (RED Criteria)\r\n\r\n| Test | Chứng minh |\r\n| :--- | :--- |\r\n| `ClassTests.Create_SetsActiveStatus_WithDefaults` | factory + trạng thái mặc định |\r\n| `ClassTests.Close_SetsClosedStatus` / `Close_IsIdempotent` | soft-close |\r\n| `ClassTests.Rename_UpdatesNameAndRoom` | hành vi rename |\r\n| `ClassTests.MaxStudents_Is30` | hằng số sĩ số cố định |\r\n| `CreateClassTests.HappyPath_PersistsActiveClass` | AC-1 tạo lớp |\r\n| `CreateClassTests.DuplicateName_SameGroupAndYear_FailsValidation` | AC-1 \"Fails when\" |\r\n| `CreateClassTests.SameName_DifferentGroupOrYear_Succeeds` | biên unique |\r\n| `CreateClassValidators` (tên rỗng, năm sai format, phòng >50) | validation REQ-1 |\r\n| `ListClassesTests.Filter_ByAgeGroup/ByYear/ByStatus/NoFilter_All/Empty` | AC-2 / REQ-2 / REQ-5 |\r\n| `GetClassDetailTests.HappyPath_VacantSlots30_EmptyLists` / `NotFound` | AC-3 |\r\n| `UpdateClassTests.HappyPath_ChangesNameRoom` / `NotFound` / `DuplicateName_ExcludingSelf` / `KeepsAgeGroupYear` | AC-4 |\r\n| `CloseClassTests.HappyPath_Closed` / `NotFound` / `AlreadyClosed_Idempotent` | AC-5 |\r\n\r\n## Risks & Trade-offs\r\n\r\n- **InMemory cho handler tests:** không enforce unique index — rule trùng tên được test qua handler check; index là defense-in-depth ở migration. Testcontainers cho integration đúng chuẩn ADR sẽ tới ở wave sau.\r\n- **Detail counts = 0 cứng:** trung thực với slice (chưa có assignment/enrollment), ticket 05 mở rộng query này.\r\n- **Migration đầu gộp cả bảng Identity:** đúng debt ledger \"migration đầu tiên ở wave có entity đầu tiên\".\r\n- **Docker Desktop phải chạy:** nếu daemon không lên được, E2E bị block và tôi sẽ báo lại (không bypass).\r\n- **Chromium Playwright:** nếu chưa cài sẽ chạy `npx playwright install chromium` (tải một lần).\r\n\r\n\u003c!-- PLAN-APPROVED: user (2026-11-05, interactive approval gate) -->\r\n\r\n**Acceptance (Capability & Regression Evals):**\r\n\u003c!-- FOUR-EYES AC ANCHOR -->\r\n- [ ] [Capability] Given biểu mẫu lớp hợp lệ (tên, khối Mầm/Chồi/Lá, năm học \"2025-2026\", phòng), When gửi tạo lớp, Then lớp mới xuất hiện trong danh sách với sĩ số 0/30.\r\n  - Fails when: thiếu trường bắt buộc hoặc tên lớp trùng trong cùng khối+năm học.\r\n- [ ] [Capability] Given danh sách lớp, When lọc theo khối và năm học, Then chỉ các lớp khớp tiêu chí hiển thị.\r\n  - Fails when: kết quả lọc không khớp khối/năm học đã chọn.\r\n- [ ] [Capability] Given một lớp, When xem chi tiết, Then hiển thị danh sách giáo viên + học sinh + số chỗ trống = 30 − sĩ số.\r\n  - Fails when: danh sách giáo viên/học sinh hiển thị thiếu hoặc thừa.\r\n- [ ] [Capability] Given một lớp, When đổi tên/phòng và lưu, Then danh sách phản ánh giá trị mới.\r\n  - Fails when: đổi tên trùng lớp khác cùng khối+năm học.\r\n- [ ] [Capability] Given một lớp, When đóng lớp, Then trạng thái thành Closed (soft-close) và vẫn hiện khi lọc \"đã đóng\".\r\n  - Fails when: lớp biến mất khỏi dữ liệu (xóa cứng) hoặc lớp đóng vẫn nhận giáo viên/học sinh mới (điểm này chốt tại ticket 03/05).\r\n- [ ] [Regression] Given trang Home mặc định Sprint 0, When render, Then vẫn hiển thị không lỗi.\r\n  - Fails when: ArchitectureTests hoặc build báo lỗi.\r\n","file":"board/features/mvp-core/tickets/01-class-crud.md"}]};</script>
