services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: smartkms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smartkms_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartkms"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
